<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Call Settings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            width: 100%;
            max-width: 380px;
            padding: 24px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .icon { font-size: 38px; margin-bottom: 8px; }
        h2 { font-size: 1.25rem; color: #f8fafc; margin-bottom: 6px; }
        p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
        
        .btn-main {
            display: block;
            width: 100%;
            padding: 15px 0;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-bottom: 20px;
            border: none;
            cursor: pointer;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 0.75rem;
            margin: 15px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #334155;
        }
        .divider span { padding: 0 10px; }

        .brand-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-brand {
            display: block;
            padding: 11px 0;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            color: #e2e8f0;
            background: #334155;
            border: 1px solid #475569;
            transition: 0.2s;
        }
        .btn-brand:active {
            background: #475569;
            transform: scale(0.98);
        }
        .note {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 18px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">⚡</div>
    <h2>कॉल सेटिंग्स बाईपास</h2>
    <p>किसी भी फोन में ब्लॉक लिस्ट या डायलर खोलने के लिए टैप करें:</p>

    <!-- 1. UNIVERSAL AUTO-FALLBACK BUTTON -->
    <!-- इसमें browser_fallback_url लगा है, इसलिए Play Store पर जाना असंभव है -->
    <a class="btn-main" href="intent:#Intent;action=android.telecom.action.SHOW_BLOCKED_NUMBERS;S.browser_fallback_url=intent%3A%23Intent%3Baction%3Dandroid.telecom.action.SHOW_CALL_SETTINGS%3BS.browser_fallback_url%3Dtel%3A%3Bend%3Bend;">
        🚀 ऑटो अनब्लॉक खोलें
    </a>

    <div class="divider"><span>या ब्रांड के हिसाब से चुनें</span></div>

    <!-- 2. BRAND SPECIFIC INTENTS -->
    <div class="brand-grid">
        <!-- Moto / Google Dialer -->
        <a class="btn-brand" href="intent:#Intent;action=android.telecom.action.SHOW_BLOCKED_NUMBERS;end">
            Moto / Stock
        </a>

        <!-- Samsung One UI -->
        <a class="btn-brand" href="intent:#Intent;action=com.samsung.android.dialer.action.BLOCKED_NUMBERS;end">
            Samsung
        </a>

        <!-- Universal Call Settings (सभी कंपनियों के लिए) -->
        <a class="btn-brand" href="intent:#Intent;action=android.telecom.action.SHOW_CALL_SETTINGS;end">
            Call Settings
        </a>

        <!-- Direct Native Dialpad (बिना किसी ऐप पर निर्भर रहे) -->
        <a class="btn-brand" href="tel:">
            Phone Dialpad
        </a>
    </div>

    <p class="note">नोट: पहले नीले बटन पर टैप करें। अगर फोन मोटो है तो 'Moto / Stock' चुनें।</p>
</div>

</body>
</html>
